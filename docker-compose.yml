version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: protegius-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-protegius}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-protegius_dev_secret_2026}
      POSTGRES_DB: ${DB_NAME:-protegius_dev}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-protegius} -d ${DB_NAME:-protegius_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: protegius-dev-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-protegius}:${DB_PASSWORD:-protegius_dev_secret_2026}@postgres:5432/${DB_NAME:-protegius_dev}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-protegius_dev_super_secret_jwt_key_32_bytes_dev}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dev.protegius.capemaxchile.com}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/login > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  postgres_dev_data:
    driver: local
